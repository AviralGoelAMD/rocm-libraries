name: rocKE PR Review
# Thin caller: the review engine lives in reusable-reviewer.yml.
on:
  pull_request:
    types: [opened, reopened]
    paths:
      - "dnn-providers/hip-kernel-provider/**"

jobs:
  review:
    uses: ./.github/workflows/reusable-reviewer.yml
    with:
      review_title: "rocKE PR Review"
      guidance_repo: AviralGoelAMD/rocke-review-guidance
      comment_marker: "<!-- rocke-pr-review-bot -->"
      sparse_checkout: |
        dnn-providers/hip-kernel-provider
        .github
    # Explicit per-caller secret mapping (never `secrets: inherit`): this caller
    # passes ONLY its own guidance token. (rocKE keeps the legacy secret name
    # GUIDANCE_REPO_TOKEN; new libraries use <LIB>_GUIDANCE_TOKEN.)
    secrets:
      LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
      GUIDANCE_REPO_TOKEN: ${{ secrets.GUIDANCE_REPO_TOKEN }}
